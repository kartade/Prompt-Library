:root{font-family:Arial,Helvetica,sans-serif;color:#17211e;background:#fff;--green:#124c39;--line:#dbe2de}*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit}header{max-width:1280px;margin:auto;padding:26px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}.brand{font-size:21px;font-weight:750;letter-spacing:-.7px;text-decoration:none;display:flex;align-items:center;gap:12px}.logo{background:var(--green);color:#fff;width:42px;height:42px;display:grid;place-items:center;font:700 18px Georgia;border-radius:50%}.langs{display:flex;gap:4px;background:#eff3f0;padding:4px;border-radius:24px}.langs button{border:0;background:none;border-radius:20px;padding:9px 13px;font-size:14px}.langs button[aria-pressed=true]{background:var(--green);color:#fff}main{max-width:1280px;padding:44px 40px 80px;margin:auto}.intro{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:36px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:700;color:var(--green)}h1{font:normal clamp(40px,5.5vw,70px)/1.04 Georgia,serif;letter-spacing:-2px;margin:18px 0}h1 em{color:var(--green)}.intro p{max-width:370px;line-height:1.7;color:#59635e;font-size:16px}.layout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:44px}nav{position:sticky;top:24px;align-self:start}nav h2{font-size:12px;letter-spacing:1.6px;margin:10px 0 18px}nav button{display:block;width:100%;text-align:left;border:0;background:none;color:#58635c;padding:13px 14px;margin:3px 0;border-radius:6px;font-size:15px}nav button[aria-pressed=true]{background:#edf4ef;color:var(--green);font-weight:700}nav button:hover{background:#f0f4f1}.count{font-size:13px;color:#6c756f;padding-top:18px;border-top:1px solid var(--line);margin-top:22px}.feed{min-width:0}.section-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 0 18px;font-size:14px}article{padding:30px 0;border-bottom:1px solid var(--line)}article.featured{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px}.visual{margin:0}.visual img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:#d56a20}figcaption{font-size:12px;color:#6a746d;margin-top:10px;line-height:1.5}.meta{display:flex;gap:12px;align-items:center;font-size:12px;color:#69716d;text-transform:uppercase;letter-spacing:1px}.tag{color:var(--green);background:#eef4ef;padding:6px 9px;border-radius:4px}h2{font:normal 31px/1.15 Georgia;margin:18px 0 12px;letter-spacing:-.5px}.description{font-size:16px;line-height:1.6;color:#606b64}.prompt{font:14px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f5;border:1px solid #e3e8e4;border-radius:8px;padding:19px;max-height:270px;overflow:auto}.copy{background:var(--green);color:white;border:0;padding:13px 18px;border-radius:5px;font-size:14px;min-height:44px}.copy:hover{background:#0a3527}.hint{font-size:13px;line-height:1.6;color:#67736b;margin-top:16px}footer{max-width:1200px;margin:auto;padding:24px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#68736b;font-size:13px;gap:16px}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172d22;color:#fff;padding:14px 22px;border-radius:8px;max-width:90%;z-index:5}.notice:empty{display:none}:focus-visible{outline:3px solid #df8a37;outline-offset:4px}@media(max-width:850px){header{padding:20px 24px}main{padding:28px 24px 50px}.layout{grid-template-columns:1fr;gap:18px}nav{position:static}nav h2,.count{display:none}.categories{display:flex;flex-wrap:wrap;gap:5px}nav button{width:auto;margin:0;padding:11px 13px}.intro{display:block;margin-bottom:20px}.intro p{max-width:540px}footer{margin:0 24px}article.featured{gap:24px}}@media(max-width:560px){header{padding:16px}.brand{font-size:18px;gap:8px}.logo{width:34px;height:34px;font-size:15px}main{padding:26px 16px 40px}h1{font-size:43px;letter-spacing:-1.5px}.intro p{font-size:15px}article.featured{grid-template-columns:1fr}.visual img{max-height:520px;object-fit:contain;background:#a44013}h2{font-size:29px}.prompt{max-height:240px;padding:15px}.copy{width:100%}footer{margin:0 16px;flex-direction:column}.langs button{padding:8px 10px}}
</style></head><body><header><a href="/" class="brand"><span class="logo">PL</span>Prompt Library<span style="color:#778579;font-size:14px;font-weight:400">/</span></a><div class="langs" aria-label="Language"><button data-lang="fr" aria-pressed="true">FR</button><button data-lang="en" aria-pressed="false">EN</button></div></header><main><section class="intro"><div><div class="eyebrow" id="eyebrow"></div><h1 id="headline"></h1></div><p id="intro"></p></section><div class="layout"><nav aria-label="Catégories"><h2 id="category-title"></h2><div class="categories" id="categories"></div><p class="count" id="total"></p></nav><section class="feed"><div class="section-top"><span id="section-name"></span><span id="result-count"></span></div><div id="articles"></div></section></div></main><footer><span>© 2026 Prompt Library · kartade</span><span id="footer-text"></span></footer><div class="notice" role="status" aria-live="polite"></div><script>
const items=[
{id:'propulsion',cat:'type',fr:['Propulsion, en lettres monumentales','Une architecture orange, une perspective vertigineuse. Le texte devient le chemin.','Crée une affiche photographique verticale 2:3. Une rampe monumentale en béton orange monte vers une ouverture lumineuse. Intègre le mot « PROPULSION » en lettres géantes couleur crème dans l’architecture, en suivant strictement les surfaces et la perspective ascendante. Un petit personnage en tenue professionnelle décontractée, vu de dos, regarde vers l’ascension. Contre-plongée spectaculaire, texture réaliste du béton, lumière cinématographique, ombres orange profondes. Sensation de mouvement vers le haut. Aucun autre texte.'],en:['Propulsion, in monumental letters','Orange architecture and a dizzying perspective. Typography becomes the path.','Create a photorealistic vertical 2:3 poster. A monumental orange concrete ramp rises toward a bright opening. Integrate the word “PROPULSION” in giant cream letters into the architecture, strictly following its surfaces and upward perspective. A small casually professional figure, viewed from behind, faces the ascent. Dramatic low angle, realistic concrete texture, cinematic light and deep orange shadows. A strong sense of upward movement. No other text.']},
{id:'architecture',cat:'type',fr:['Le mot fait l’architecture','Un modèle à personnaliser pour tes propres affiches en perspective.','TITRE : [mot ou expression]\nMARQUE : [nom]\nESPACE : [rampe / passage / escalier]\nMOUVEMENT : [ascension / propulsion]\nCOULEUR : [couleur dominante]\nFORMAT : [9:16]\n\nCrée une affiche où une typographie monumentale est physiquement intégrée à l’architecture. Construis d’abord la perspective, puis fais suivre aux lettres les surfaces, courbes et points de fuite. Le titre doit rester lisible. Ajoute un petit personnage regardant dans la direction du mouvement. Texture de béton réaliste, lumière spectaculaire, composition minimaliste.'],en:['The word becomes architecture','A customizable framework for your own perspective posters.','TITLE: [word or phrase]\nBRAND: [name]\nSPACE: [ramp / passage / staircase]\nMOTION: [rise / propulsion]\nCOLOR: [dominant color]\nFORMAT: [9:16]\n\nCreate a poster with monumental typography physically integrated into architecture. Build the perspective first, then make the letters follow the surfaces, curves and vanishing points. Keep the title readable. Add a small human figure facing the direction of movement. Realistic concrete texture, dramatic lighting, minimalist composition.']},
{id:'motion',cat:'images',fr:['Capturer l’élan','Une image fixe qui donne une impression de vitesse.','Crée une photographie publicitaire de [sujet] en plein mouvement dans [environnement]. Utilise un effet de filé directionnel sur l’arrière-plan tout en gardant le sujet principal net. Composition diagonale, cadrage dynamique, éclairage [type], palette [couleurs]. Le mouvement doit être perceptible dans les lignes, les matières et la posture. Rendu photographique détaillé, sans texte ni filigrane.'],en:['Capture the momentum','A still image with a sense of speed.','Create an advertising photograph of [subject] in motion in [environment]. Use directional motion blur in the background while keeping the main subject sharp. Diagonal composition, dynamic framing, [type] lighting and a [colors] palette. Express movement through lines, materials and posture. Detailed photographic rendering, no text or watermark.']},
{id:'product',cat:'ads',fr:['Le produit, premier rôle','Une photographie de campagne simple et expressive.','Crée une photographie publicitaire premium de [produit] pour [marque]. Place le produit au centre d’un décor [description] avec une palette limitée à [trois couleurs]. Éclairage de studio précis, matières réalistes, ombres cohérentes. Préserve la forme et les détails du produit fourni en référence. Laisse un espace négatif pour une accroche ajoutée plus tard. Format [4:5]. Aucun texte inventé.'],en:['The product takes center stage','A simple, expressive campaign photograph.','Create a premium advertising photograph of [product] for [brand]. Place the product in a [description] setting with a palette limited to [three colors]. Precise studio lighting, realistic materials and consistent shadows. Preserve the shape and details of the reference product. Leave negative space for a headline to be added later. Format [4:5]. Do not invent text.']},
{id:'agent',cat:'agents',fr:['Transformer un service en logiciel','Décomposer un métier pour concevoir un premier produit utile.','Analyse le fonctionnement d’une entreprise de services dans [niche]. Décompose son processus en étapes : entrées, sorties, outils, décisions humaines et points de ralentissement. Distingue les tâches automatisables de celles nécessitant une validation. Propose un premier produit IA simple, un parcours utilisateur, les données nécessaires et les limites. Termine par un plan de prototype et trois hypothèses à tester auprès de vrais clients. N’invente pas de données de marché.'],en:['Turn a service into software','Break down a workflow to design a useful first product.','Analyze how a service business in [niche] operates. Break its workflow into steps: inputs, outputs, tools, human decisions and bottlenecks. Separate tasks suitable for automation from those requiring approval. Propose a simple first AI product, user journey, required data and limitations. End with a prototype plan and three assumptions to test with real customers. Do not invent market data.']}
];
const ui={fr:{eyebrow:'LE CARNET DES IDÉES À CRÉER',headline:'Un prompt.<br><em>Mille possibilités.</em>',intro:'Des prompts à explorer, à copier et à faire tiens. Choisis une idée, remplace les éléments entre crochets et crée.',cats:['Tous les prompts','Typographie','Images & mouvement','Publicité','Agents IA'],category:'CATÉGORIES',copy:'Copier le prompt',copied:'Prompt copié !',error:'Copie indisponible. Sélectionne le texte du prompt pour le copier.',example:'Exemple généré avec le prompt ci-contre. Le résultat peut varier.',hint:'À personnaliser : remplace les éléments entre [crochets].',footer:'Les idées se partagent. À toi de créer.',unit:'prompts'},en:{eyebrow:'A NOTEBOOK OF CREATIVE POSSIBILITIES',headline:'One prompt.<br><em>Endless possibilities.</em>',intro:'Prompts to explore, copy and make your own. Pick an idea, replace the text in brackets and create.',cats:['All prompts','Typography','Images & motion','Advertising','AI agents'],category:'CATEGORIES',copy:'Copy prompt',copied:'Prompt copied!',error:'Copy unavailable. Select the prompt text to copy it manually.',example:'Example generated with this prompt. Results may vary.',hint:'Make it yours: replace the text in [brackets].',footer:'Ideas are for sharing. Make something yours.',unit:'prompts'}};
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'fr',category='all',timer;const keys=['all','type','images','ads','agents'];const $=s=>document.querySelector(s);function render(){const t=ui[lang];document.documentElement.lang=lang;document.title=lang==='fr'?'Prompt Library — Des idées à créer':'Prompt Library — Ideas to create';$('#eyebrow').textContent=t.eyebrow;$('#headline').innerHTML=t.headline;$('#intro').textContent=t.intro;$('#category-title').textContent=t.category;$('#footer-text').textContent=t.footer;$('nav').setAttribute('aria-label',t.category);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));$('#categories').replaceChildren(...keys.map((k,i)=>{const b=document.createElement('button');b.textContent=t.cats[i];b.setAttribute('aria-pressed',k===category);b.onclick=()=>{category=k;render()};return b}));$('#total').textContent=items.length+' '+t.unit+' · FR / EN';const selected=items.filter(i=>category==='all'||i.cat===category);$('#section-name').textContent=t.cats[keys.indexOf(category)];$('#result-count').textContent=String(selected.length).padStart(2,'0');$('#articles').replaceChildren(...selected.map((item,index)=>{const a=document.createElement('article');a.id=item.id;if(item.id==='propulsion'){a.className='featured';const fig=document.createElement('figure');fig.className='visual';const img=document.createElement('img');img.src='/social.jpg';img.alt=lang==='fr'?'Affiche PROPULSION : rampe de béton orange et personnage tourné vers la lumière':'PROPULSION poster: orange concrete ramp and a figure facing the light';img.width=1024;img.height=1536;fig.append(img);const cap=document.createElement('figcaption');cap.textContent=t.example;fig.append(cap);a.append(fig)}const body=document.createElement('div');const meta=document.createElement('div');meta.className='meta';const tag=document.createElement('span');tag.className='tag';tag.textContent=t.cats[keys.indexOf(item.cat)];meta.append(tag);body.append(meta);const h=document.createElement('h2');h.textContent=item[lang][0];body.append(h);const d=document.createElement('p');d.className='description';d.textContent=item[lang][1];body.append(d);const p=document.createElement('pre');p.className='prompt';p.textContent=item[lang][2];p.tabIndex=0;body.append(p);const b=document.createElement('button');b.className='copy';b.textContent=t.copy;b.onclick=async()=>{try{await navigator.clipboard.writeText(item[lang][2]);$('.notice').textContent=ui[lang].copied}catch(e){$('.notice').textContent=ui[lang].error}clearTimeout(timer);timer=setTimeout(()=>$('.notice').textContent='',4500)};body.append(b);if(item[lang][2].includes('[')){const hint=document.createElement('p');hint.className='hint';hint.textContent=t.hint;body.append(hint)}a.append(body);return a}))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);render()});render();
</script></body></html>
